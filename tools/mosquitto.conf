# IS25 MQTT broker (Mosquitto 2.x) for the robot car and the web dashboard.
#
# Start it from this folder, and leave the window open:
#   "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v
#
# "listener 1883" with no address = every address this laptop has, so this
# file never needs editing when the phone hotspot hands out a new address
# range. The car finds the laptop by itself (its firmware looks for the
# address ending in .184 on the hotspot).
#
# If it fails with "Only one usage of each socket address", the Mosquitto
# Windows service already holds port 1883: services.msc -> Mosquitto Broker
# -> Stop (and set Startup type to Manual so it does not come back).

listener 1883
allow_anonymous true
persistence false
